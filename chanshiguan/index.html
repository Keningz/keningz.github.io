<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>你是什么样的铲屎官</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<link rel="stylesheet" href="fonts/zcool.css">
<style>
/* Layout: one phone-width column, three views (cover, quiz, result) swapped in place. Single deliberate light look: catnip mint + ink + salmon. */
:root{
  --bg:#E6F2EC; --card:#FFFFFF; --ink:#1F2A37; --muted:#5E6B78; --line:#CFE0D7;

  --f-display:"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",sans-serif;

  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65;
  background-image:radial-gradient(var(--line) 1.2px,transparent 1.2px);background-size:22px 22px}
.app{max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.02em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--pop);outline-offset:2px}
.btn{background:var(--ink);color:#fff;border-radius:999px;padding:14px 22px;font-weight:700;font-size:17px;
  box-shadow:0 4px 0 #0d141c;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0d141c}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1 1 140px}

/* cover */
.cover{align-items:center;text-align:center;padding-top:12px}
.cover canvas{width:200px;height:200px}
.cover h1{font-size:clamp(36px,10vw,46px);line-height:1.15}
.cover h1 em{font-style:normal;color:var(--pop)}
.cover .sub{color:var(--muted);max-width:30ch}
.facts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.facts span{font-size:13px;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:3px 12px}
.cover .btn{width:100%;max-width:320px}
.small{font-size:12.5px;color:var(--muted)}

/* quiz */
.qtop{display:flex;align-items:center;gap:12px}
.back{font-size:14px;color:var(--muted);padding:6px 4px;white-space:nowrap}
.back:disabled{opacity:.3;cursor:default}
.bar{flex:1;height:10px;background:var(--card);border-radius:99px;border:1.5px solid var(--ink);overflow:hidden}
.bar i{display:block;height:100%;background:var(--mint);width:0;transition:width .25s}
.count{font-variant-numeric:tabular-nums;font-size:14px;font-weight:700;white-space:nowrap}
.qcard{background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:22px 20px;box-shadow:6px 6px 0 var(--mint)}
.qno{font-size:12px;letter-spacing:.14em;color:var(--mint);font-weight:700}
.qtext{font-family:var(--f-display);font-size:25px;line-height:1.35;margin-top:6px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:13px 16px;font-size:15.5px;
  display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;transition:border-color .12s,background .12s}
.opt b{font-size:13px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--mint-soft);color:var(--mint);margin-top:1px}
.opt:hover{border-color:var(--ink)}
.opt.on{border-color:var(--pop);background:var(--pop-soft)}
.opt.on b{background:var(--pop);color:#fff}

/* result */
.friend{background:var(--pop-soft);border:1.5px dashed var(--pop);border-radius:12px;padding:10px 14px;font-size:14px;text-align:center}
.rcard{background:var(--card);border:2px solid var(--ink);border-radius:20px;overflow:hidden;box-shadow:6px 6px 0 var(--pop)}
.rhead{padding:22px 20px 10px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.rhead canvas{width:170px;height:170px}
.rlabel{font-size:12px;letter-spacing:.16em;color:var(--muted)}
.rname{font-size:40px;line-height:1.1}
.rtitle{font-weight:700;color:var(--pop)}
.rare{font-size:12px;background:var(--ink);color:#fff;border-radius:99px;padding:2px 10px}
.tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.tags span{font-size:13px;background:var(--mint-soft);border-radius:99px;padding:2px 10px}
.rbody{padding:6px 20px 22px;display:flex;flex-direction:column;gap:16px}
.desc{font-size:15.5px}
.says{background:var(--bg);border-radius:14px;padding:12px 14px;font-size:15px;position:relative}
.says small{display:block;font-size:12px;color:var(--muted);letter-spacing:.08em;margin-bottom:2px}
.radar{width:100%;max-width:380px;height:auto;align-self:center}
.dims{display:flex;flex-direction:column;gap:9px}
.dim{display:grid;grid-template-columns:5.6em 1fr 2.4em;gap:10px;align-items:center;font-size:14px}
.dim .t{height:12px;border-radius:99px;background:var(--bg);overflow:hidden}
.dim .t i{display:block;height:100%;border-radius:99px;background:var(--mint)}
.dim .v{font-variant-numeric:tabular-nums;text-align:right;font-weight:700}
.rel{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rel button{background:var(--bg);border-radius:14px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.rel small{font-size:12px;color:var(--muted)}
.rel strong{font-family:var(--f-display);font-weight:400;font-size:19px}
.rel span{font-size:12.5px;color:var(--muted)}
.sec{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.poster{display:flex;flex-direction:column;gap:10px;align-items:center}
.poster img{width:100%;max-width:340px;border-radius:14px;border:2px solid var(--ink)}
.linkbox{width:100%;font-size:13px;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;word-break:break-all;user-select:all}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:8px 16px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gallery button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:8px 2px}
.gallery button.me{border-color:var(--pop);background:var(--pop-soft)}
.gallery canvas{width:52px;height:52px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}
.view.enter{animation:pop .22s ease-out}
</style>

</head>
<body>
<div class="app">
  <section class="view cover" id="v-cover">
    <canvas id="coverCat" width="400" height="400" aria-hidden="true"></canvas>
    <h1>测测你是<br>什么样的<em>铲屎官</em></h1>
    <p class="sub">20 个养猫日常瞬间，测出你在猫眼里到底是什么人。</p>
    <div class="facts"><span>20 题</span><span>约 2 分钟</span><span>你是哪一种？</span></div>
    <button class="btn" id="startBtn">开始测试</button>
    <p class="small">纯属娱乐，没有对错。按第一反应选就好。</p>
  </section>

  <section class="view" id="v-quiz" hidden>
    <div class="qtop">
      <button class="back" id="backBtn">‹ 上一题</button>
      <div class="bar"><i id="barFill"></i></div>
      <span class="count" id="count">1 / 20</span>
    </div>
    <div class="qcard">
      <div class="qno" id="qno">第 1 题</div>
      <div class="qtext" id="qtext"></div>
    </div>
    <div class="opts" id="opts"></div>
  </section>

  <section class="view" id="v-result" hidden>
    <div class="friend" id="friendNote" hidden>这是朋友测出的结果。你是哪一种？</div>
    <article class="rcard">
      <div class="rhead">
        <canvas id="resCat" width="340" height="340" aria-hidden="true"></canvas>
        <span class="rlabel" id="rlabel">你是</span>
        <h2 class="rname" id="rname"></h2>
        <p class="rtitle" id="rtitle"></p>
        <span class="rare" id="rare" hidden>稀有结果</span>
        <div class="tags" id="rtags"></div>
      </div>
      <div class="rbody">
        <p class="desc" id="rdesc"></p>
        <div class="says"><small>你的猫对你的评价</small><span id="rsays"></span></div>
        <div class="sec">铲屎五维</div>
        <canvas class="radar" id="rdims" width="720" height="500" role="img" aria-label="铲屎五维雷达图"></canvas>
        <div class="rel" id="rrel"></div>
      </div>
    </article>
    <div class="row" id="selfActions">
      <button class="btn" id="posterBtn">分享到朋友圈</button>
      <button class="btn ghost" id="shareBtn">复制结果链接</button>
    </div>
    <div class="row" id="friendActions" hidden>
      <button class="btn" id="tryBtn">我也测一测</button>
    </div>
    <div class="poster" id="posterBox" hidden>
      <img id="posterImg" alt="铲屎官测试朋友圈分享图">
      <p class="small">长按图片保存到相册，再发到朋友圈</p>
    </div>
    <div class="linkbox" id="linkBox" hidden></div>
    <button class="btn ghost" id="againBtn">再测一次</button>
  </section>
</div>
<div class="toast" id="toast" role="status"></div>

const STATS=DIMS.map(d=>{let m=0,v=0;for(const [,opts] of Q){const xs=opts.map(o=>o[1][d]||0);const mu=xs.reduce((a,b)=>a+b)/4;m+=mu;v+=xs.reduce((a,b)=>a+(b-mu)**2,0)/4}return[m,Math.sqrt(v)]});
function erf(x){const t=1/(1+.3275911*Math.abs(x));const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-x*x);return x>=0?y:-y}
const Phi=z=>.5*(1+erf(z/Math.SQRT2));
function score(ans){
  const s={};ans.forEach((a,i)=>{const o=Q[i][1][a][1];for(const k in o)s[k]=(s[k]||0)+o[k]});
  const p=DIMS.map((d,j)=>Phi(((s[d]||0)-STATS[j][0])/STATS[j][1]));
  let best,bd=1e9;for(const k in R){const dd=R[k].reduce((a,v,j)=>a+(v-p[j])**2,0);if(dd<bd){bd=dd;best=k}}
  return{type:best,pct:p.map(x=>Math.max(1,Math.min(99,Math.round(x*100))))};
}

}
